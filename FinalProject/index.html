<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Volume Bird</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="c"></canvas>

    <div id="hud">
      <div id="vol-display">VOL 0%</div>
    </div>

    <button id="mode-btn">NORMAL</button>

    <div id="track-bar">
      <div id="track-fill"></div>
    </div>
    <div id="track-pos">0:00 / 3:00</div>

      <div id="overlay">
        <h2>Volume Bird</h2>
        <p>Fly through pipes to set your volume.<br />Choose your goal:</p>
        <div style="display:flex; gap:12px; margin-top:4px;">
          <button id="btn-louder">🔊 Louder</button>
          <button id="btn-quieter">🔉 Quieter</button>
        </div>
        <div class="controls-hint">
          <span>⬆ Space / Click — Flap</span>
          <span>Land on ground to save volume</span>
        </div>
      </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
